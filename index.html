<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Progress — Goal Driven Day Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">✦</span><span>Progress</span></div>
      <nav class="nav">
        <button class="nav-item active" data-view="today">⌂ <span>Today</span></button>
        <button class="nav-item" data-view="planner">◷ <span>Planner</span></button>
        <button class="nav-item" data-view="tasks">✓ <span>Tasks</span></button>
        <button class="nav-item" data-view="goals">◎ <span>Goals</span></button>
        <button class="nav-item" data-view="habits">↻ <span>Habits</span></button>
        <button class="nav-item" data-view="ideas">✎ <span>Ideas</span></button>
        <button class="nav-item" data-view="review">☾ <span>Daily Review</span></button>
        <button class="nav-item" data-view="calendar">▦ <span>History</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-view="settings">⚙ <span>Settings</span></button>
        <div class="connection-pill" id="connectionPill">Local mode</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div>
          <div class="eyebrow" id="dateLabel"></div>
          <h1 id="viewTitle">Today</h1>
        </div>
        <div class="top-actions">
          <button class="ghost-btn" id="captureBtn">＋ Capture</button>
          <button class="primary-btn" id="quickAddBtn">＋ Task</button>
        </div>
      </header>

      <div id="viewContainer"></div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
